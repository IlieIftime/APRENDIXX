[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aprendix"
version = "0.18.0"
description = "Local-first adaptive programming learning platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0,<47.0",
    "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
]
gui = [
    "kivy>=2.3.1,<3.0",
]
rag = [
    "beautifulsoup4>=4.12,<5.0",
    "pypdf>=5.0,<7.0",
    "rapidocr-onnxruntime>=1.4,<2.0",
]
cluster-build = [
    "scikit-learn>=1.3,<2.0",
]
beeware = [
    "toga>=0.5,<0.6",
]
desktop-build = [
    "pyinstaller>=6.14,<7.0",
]
mobile-build = [
    "briefcase>=0.3.25,<0.5",
    "buildozer>=1.5,<2.0",
]

[project.scripts]
aprendix = "aprendix.bootstrap:main"
aprendix-gui = "aprendix.bootstrap:gui_main"
aprendix-ingest = "aprendix.ingest_cli:main"
aprendix-cluster = "aprendix.ingest_cli:cluster_main"

[tool.hatch.build.targets.wheel]
packages = ["src/aprendix"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src", "mobile"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aprendix"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.briefcase]
project_name = "Aprendix"
bundle = "io.aprendix"
version = "0.18.0"
license = "MIT"
license_files = ["LICENSE"]

[tool.briefcase.app.aprendix]
formal_name = "Aprendix"
description = "Local-first adaptive programming learning"
sources = ["src", "mobile"]
requires = [
    "cryptography>=43.0,<47.0",
    "pydantic>=2.8,<3.0",
]

[tool.briefcase.app.aprendix.iOS]
requires = [
    "toga-iOS>=0.5,<0.6",
]
permission.user_notifications = "O Aprendix usa lembretes locais para revisões escolhidas no dispositivo."
